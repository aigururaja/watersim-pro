# WaterSim Pro — Production Docker Compose
#
# Prerequisites:
#   1. Create .env.prod from .env.prod.example and populate all values.
#   2. Place TLS certs at ./nginx/certs/ (or use Certbot volume below).
#   3. docker compose -f docker-compose.prod.yml up -d
#
# To run a one-off migration:
#   docker compose -f docker-compose.prod.yml run --rm backend node src/db/migrate.js up
#
# To seed:
#   docker compose -f docker-compose.prod.yml run --rm backend node src/seeds/index.js

version: "3.9"

# ── Secrets (Docker Swarm syntax; for plain Compose, use env_file) ────────────
# In Swarm: docker secret create jwt_secret ./secrets/jwt_secret.txt
# For non-Swarm environments, env_file is used instead (see below).

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: watersim-db-prod
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - internal
    # No ports exposed — only reachable from internal network

  # ── Migration runner (exits after completion) ────────────────────────────────
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: watersim-migrate
    env_file: .env.prod
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command: ["node", "src/db/migrate.js", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    restart: "no"

  # ── Backend API ──────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: watersim-api-prod
    env_file: .env.prod
    environment:
      NODE_ENV:         production
      PORT:             4000
      DATABASE_URL:     postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CORS_ORIGIN:      ${CORS_ORIGIN}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health | grep -q '\"status\":\"healthy\"' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # ── Frontend (Nginx + Vite static build) ────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE: /api/v1
        VITE_WS_URL:   wss://${PUBLIC_HOST}/ws
    container_name: watersim-ui-prod
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ | head -c 20 | grep -q '<!DOCTYPE' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - internal
      - public
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  # ── Nginx reverse proxy (TLS termination) ────────────────────────────────────
  proxy:
    image: nginx:1.27-alpine
    container_name: watersim-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/letsencrypt:ro      # Certbot certs
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - public
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

  # ── Certbot (optional — renew certs) ─────────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: watersim-certbot
    volumes:
      - ./nginx/certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'
    restart: unless-stopped
    profiles:
      - tls   # only active with: docker compose --profile tls up

volumes:
  postgres_data:
    driver: local
  certbot_www:
    driver: local

networks:
  internal:
    driver: bridge
    internal: true    # no direct internet access for DB/backend
  public:
    driver: bridge
