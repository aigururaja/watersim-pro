# WaterSim Pro — Production Docker Compose
#
# Prerequisites:
#   1. Create .env.prod from .env.prod.example and populate all values
#      (CD writes it automatically; it must also contain IMAGE_ORG + IMAGE_TAG).
#   2. Bootstrap TLS certs ONCE via scripts/init-tls.sh (see docs/RUNBOOK-deploy.md),
#      then run the certbot renewer with: --profile tls
#   3. docker compose --env-file .env.prod -f docker-compose.prod.yml up -d
#
# Always pass `--env-file .env.prod` — the ${VAR} interpolations below are
# resolved from it (env_file: alone only sets vars INSIDE containers).
#
# Images are pulled from GHCR (pushed by .github/workflows/cd.yml). The build:
# blocks are a fallback for building locally; normal deploys must `pull`, never
# rebuild on the host. All build contexts are the repo root (npm workspaces
# monorepo with a single root package-lock.json).
#
# To run a one-off migration:
#   docker compose --env-file .env.prod -f docker-compose.prod.yml run --rm migrate
#
# To seed:
#   docker compose --env-file .env.prod -f docker-compose.prod.yml run --rm backend node src/seeds/index.js

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: watersim-db-prod
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - internal
    # docker compose (non-Swarm) ignores deploy.resources — use mem_limit/cpus
    mem_limit: 1g
    cpus: 1.0
    # No ports exposed — only reachable from internal network

  # ── Migration runner (exits after completion) ────────────────────────────────
  migrate:
    image: ghcr.io/${IMAGE_ORG:-your-org}/watersim-backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    container_name: watersim-migrate
    env_file: .env.prod
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command: ["node", "src/db/migrate.js", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    restart: "no"

  # ── Backend API ──────────────────────────────────────────────────────────────
  backend:
    image: ghcr.io/${IMAGE_ORG:-your-org}/watersim-backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    container_name: watersim-api-prod
    env_file: .env.prod
    environment:
      NODE_ENV:         production
      PORT:             4000
      DATABASE_URL:     postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CORS_ORIGIN:      ${CORS_ORIGIN}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health | grep -q '\"status\":\"healthy\"' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - internal
    mem_limit: 512m
    cpus: 1.0

  # ── Frontend (Nginx + Vite static build) ────────────────────────────────────
  frontend:
    image: ghcr.io/${IMAGE_ORG:-your-org}/watersim-frontend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: frontend/Dockerfile.prod
      args:
        VITE_API_BASE: /api/v1
        VITE_WS_URL:   wss://${PUBLIC_HOST}/ws
    container_name: watersim-ui-prod
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ | head -c 20 | grep -q '<!DOCTYPE' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - internal
      - public
    mem_limit: 128m
    cpus: 0.5

  # ── Nginx reverse proxy (TLS termination) ────────────────────────────────────
  proxy:
    image: nginx:1.27-alpine
    container_name: watersim-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/letsencrypt:ro      # Certbot certs (bootstrap: scripts/init-tls.sh)
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - public
      - internal
    mem_limit: 64m
    cpus: 0.25

  # ── Certbot (renewal only — first issuance is scripts/init-tls.sh) ──────────
  certbot:
    image: certbot/certbot:latest
    container_name: watersim-certbot
    volumes:
      - ./nginx/certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done'
    restart: unless-stopped
    profiles:
      - tls   # only active with: docker compose --profile tls up

volumes:
  postgres_data:
    driver: local
  certbot_www:
    driver: local

networks:
  internal:
    driver: bridge
    internal: true    # no direct internet access for DB/backend
  public:
    driver: bridge
