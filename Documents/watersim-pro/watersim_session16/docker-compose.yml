# WaterSim Pro — Local Development Stack
# Usage:
#   docker compose up          # start all services
#   docker compose up -d       # detached
#   docker compose down -v     # stop + remove volumes
#   docker compose run --rm backend npm run seed

version: "3.9"

services:
  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: watersim-db
    environment:
      POSTGRES_DB:       watersim_dev
      POSTGRES_USER:     watersim
      POSTGRES_PASSWORD: watersim_dev_pw
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro   # auto-run on first start
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watersim -d watersim_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Backend API ─────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: watersim-api
    environment:
      NODE_ENV:         development
      PORT:             4000
      API_VERSION:      v1
      DATABASE_URL:     postgres://watersim:watersim_dev_pw@postgres:5432/watersim_dev
      JWT_SECRET:       dev-jwt-secret-change-in-production
      JWT_ACCESS_EXPIRES_IN:  15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN:      http://localhost:3000
      BCRYPT_ROUNDS:    10
      RATE_LIMIT_MAX:   500
    volumes:
      - ./backend/src:/app/src:ro          # live reload reads from host
      - /app/node_modules                   # container-private node_modules
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── Frontend (Vite dev server) ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: watersim-ui
    environment:
      VITE_API_BASE: http://localhost:4000/api/v1
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
