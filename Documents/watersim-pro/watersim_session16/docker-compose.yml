# WaterSim Pro — Local Development Stack
# Usage:
#   docker compose up          # start all services (migrations run automatically)
#   docker compose up -d       # detached
#   docker compose down -v     # stop + remove volumes
#   docker compose run --rm backend npm run seed     # seed demo data
#   docker compose run --rm migrate                  # re-run migrations manually
#
# NOTE: this is an npm-workspaces monorepo with a single root package-lock.json,
# so every build context is the repo root (context: .).

services:
  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: watersim-db
    environment:
      POSTGRES_DB:       watersim_dev
      POSTGRES_USER:     watersim
      POSTGRES_PASSWORD: watersim_dev_pw
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Schema is managed by the versioned migration runner (migrate service
      # below) — NOT by initdb SQL dumps, which go stale.
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watersim -d watersim_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Migration runner (one-shot; exits after applying pending migrations) ───
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: watersim-backend-dev
    container_name: watersim-migrate-dev
    environment:
      NODE_ENV:     development
      DATABASE_URL: postgres://watersim:watersim_dev_pw@postgres:5432/watersim_dev
    command: ["npm", "run", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ── Backend API ─────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: watersim-backend-dev
    container_name: watersim-api
    environment:
      NODE_ENV:         development
      PORT:             4000
      API_VERSION:      v1
      DATABASE_URL:     postgres://watersim:watersim_dev_pw@postgres:5432/watersim_dev
      JWT_SECRET:       dev-jwt-secret-change-in-production
      JWT_ACCESS_EXPIRES_IN:  15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN:      http://localhost:3000
      BCRYPT_ROUNDS:    10
      RATE_LIMIT_MAX:   500
    volumes:
      - ./backend/src:/repo/backend/src:ro   # nodemon hot reload reads from host
      - /repo/node_modules                    # container-private node_modules
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # ── Frontend (Vite dev server) ─────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: watersim-ui
    environment:
      VITE_API_BASE: http://localhost:4000/api/v1
    volumes:
      - ./frontend/src:/repo/frontend/src:ro   # Vite HMR reads from host
      - /repo/node_modules                      # container-private node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
