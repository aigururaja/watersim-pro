# ─────────────────────────────────────────────────────────────────────────────
# WaterSim Pro — CD Pipeline
# Triggers on push to main (after CI passes).
# Builds, pushes to GHCR, then SSH-deploys to production server.
#
# The production host runs PRE-BUILT images pulled from GHCR — it never builds
# from source. Only the deploy files (docker-compose.prod.yml, nginx/, scripts/)
# are checked out on the host; scripts/deploy.sh handles pull → migrate → up,
# with a retried health check and automatic rollback to the previously
# deployed tag (recorded in .deploy/current_tag on the host).
#
# Required GitHub Secrets:
#   DEPLOY_HOST       — production server IP / hostname
#   DEPLOY_USER       — SSH user (e.g. deploy)
#   DEPLOY_SSH_KEY    — private SSH key (PEM format)
#   DEPLOY_PATH       — absolute path on server e.g. /srv/watersim
#   PUBLIC_HOST       — public hostname e.g. app.watersim.example.com
#   POSTGRES_DB       — production DB name
#   POSTGRES_USER     — production DB user
#   POSTGRES_PASSWORD — production DB password
#   JWT_SECRET        — production JWT secret (>=32 chars)
#   CORS_ORIGIN       — production CORS origin
# (Image push uses the built-in GITHUB_TOKEN with packages:write.)
# ─────────────────────────────────────────────────────────────────────────────

name: CD

on:
  push:
    branches: [main]

env:
  REGISTRY:    ghcr.io
  IMAGE_ORG:   ${{ github.repository_owner }}

jobs:
  # ── Build + push images ─────────────────────────────────────────────────────
  push-images:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages:  write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/watersim-backend
            ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/watersim-frontend
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # Backend — context is the REPO ROOT (workspace build, single root lockfile)
      - name: Build + push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile.prod
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/watersim-backend:${{ steps.meta.outputs.version }},${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/watersim-backend:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      # Frontend — context is the REPO ROOT (also needs nginx/frontend.conf)
      - name: Build + push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./frontend/Dockerfile.prod
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/watersim-frontend:${{ steps.meta.outputs.version }},${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/watersim-frontend:latest
          build-args: |
            VITE_API_BASE=/api/v1
            VITE_WS_URL=wss://${{ secrets.PUBLIC_HOST }}/ws
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ── Deploy to production ────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: push-images
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key:      ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH }}

            # Minimal checkout: ONLY the files needed to run pulled images on
            # the host (compose file, nginx configs, scripts). No source build,
            # no `git reset --hard` over the whole tree.
            git fetch origin main
            git checkout --force origin/main -- \
              docker-compose.prod.yml nginx scripts .env.prod.example

            # Write production env file from secrets.
            # IMAGE_ORG / IMAGE_TAG pin the exact images this pipeline pushed;
            # docker compose is always invoked with --env-file .env.prod so
            # these reach the ${VAR} interpolations in the compose file.
            cat > .env.prod << 'EOF'
            NODE_ENV=production
            PORT=4000
            API_VERSION=v1
            PUBLIC_HOST=${{ secrets.PUBLIC_HOST }}
            CORS_ORIGIN=${{ secrets.CORS_ORIGIN }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_ACCESS_EXPIRES_IN=15m
            JWT_REFRESH_EXPIRES_IN=7d
            BCRYPT_ROUNDS=12
            RATE_LIMIT_WINDOW_MS=900000
            RATE_LIMIT_MAX=300
            AUTH_RATE_LIMIT_MAX=10
            DB_POOL_MIN=2
            DB_POOL_MAX=20
            IMAGE_ORG=${{ env.IMAGE_ORG }}
            IMAGE_TAG=${{ needs.push-images.outputs.image_tag }}
            EOF
            chmod 600 .env.prod

            # Pull → migrate → rolling update → health check (30×2s) → rollback
            # on failure. The script records the previously deployed tag to
            # .deploy/previous_tag before switching.
            IMAGE_TAG='${{ needs.push-images.outputs.image_tag }}' \
              bash scripts/deploy.sh

            echo "Deploy complete — $(date)"

      - name: Smoke test health endpoint (retry loop)
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "https://${{ secrets.PUBLIC_HOST }}/health" | grep -q '"status":"healthy"'; then
              echo "Health check passed (attempt $i)"
              exit 0
            fi
            echo "Attempt $i/30 failed; retrying in 2s..."
            sleep 2
          done
          echo "Health endpoint never became healthy" >&2
          exit 1
