# ─────────────────────────────────────────────────────────────────────────────
# WaterSim Pro — CD Pipeline
# Triggers on push to main (after CI passes).
# Builds, pushes to GHCR, then SSH-deploys to production server.
#
# Required GitHub Secrets:
#   GHCR_TOKEN        — GitHub PAT with packages:write scope (or use GITHUB_TOKEN)
#   DEPLOY_HOST       — production server IP / hostname
#   DEPLOY_USER       — SSH user (e.g. deploy)
#   DEPLOY_SSH_KEY    — private SSH key (PEM format)
#   DEPLOY_PATH       — absolute path on server e.g. /srv/watersim
#   PUBLIC_HOST       — public hostname e.g. app.watersim.example.com
#   POSTGRES_DB       — production DB name
#   POSTGRES_USER     — production DB user
#   POSTGRES_PASSWORD — production DB password
#   JWT_SECRET        — production JWT secret (>=32 chars)
#   CORS_ORIGIN       — production CORS origin
# ─────────────────────────────────────────────────────────────────────────────

name: CD

on:
  push:
    branches: [main]

env:
  REGISTRY:    ghcr.io
  IMAGE_ORG:   ${{ github.repository_owner }}

jobs:
  # ── Build + push images ─────────────────────────────────────────────────────
  push-images:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages:  write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/watersim-backend
            ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/watersim-frontend
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # Backend
      - name: Build + push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/watersim-backend:${{ steps.meta.outputs.version }},${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/watersim-backend:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      # Frontend
      - name: Build + push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/watersim-frontend:${{ steps.meta.outputs.version }},${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/watersim-frontend:latest
          build-args: |
            VITE_API_BASE=/api/v1
            VITE_WS_URL=wss://${{ secrets.PUBLIC_HOST }}/ws
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ── Deploy to production ────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: push-images
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key:      ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH }}

            # Pull latest docker-compose files from this deploy
            git fetch origin main
            git reset --hard origin/main

            # Write production env file from secrets
            cat > .env.prod << 'EOF'
            NODE_ENV=production
            PORT=4000
            API_VERSION=v1
            PUBLIC_HOST=${{ secrets.PUBLIC_HOST }}
            CORS_ORIGIN=${{ secrets.CORS_ORIGIN }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_ACCESS_EXPIRES_IN=15m
            JWT_REFRESH_EXPIRES_IN=7d
            BCRYPT_ROUNDS=12
            RATE_LIMIT_WINDOW_MS=900000
            RATE_LIMIT_MAX=300
            AUTH_RATE_LIMIT_MAX=10
            DB_POOL_MIN=2
            DB_POOL_MAX=20
            EOF

            # Pull updated images
            docker compose -f docker-compose.prod.yml pull backend frontend

            # Run migrations before swapping traffic
            docker compose -f docker-compose.prod.yml run --rm migrate

            # Rolling update (zero downtime: new container starts, old stops)
            docker compose -f docker-compose.prod.yml up -d --no-deps --remove-orphans backend frontend proxy

            # Clean up dangling images
            docker image prune -f

            echo "✅ Deploy complete — $(date)"

      - name: Smoke test health endpoint
        run: |
          sleep 10
          curl -f https://${{ secrets.PUBLIC_HOST }}/health | jq .
