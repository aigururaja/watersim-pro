# ─────────────────────────────────────────────────────────────────────────────
# WaterSim Pro — CI Pipeline
# Runs on every push and pull request to main / develop.
#
# Jobs:
#   lint-backend    → ESLint + dependency audit
#   test-backend    → Jest (with a real Postgres service container)
#   lint-frontend   → ESLint
#   test-frontend   → Vitest
#   build-images    → docker buildx build (no push; confirms builds succeed)
#
# Deployment is handled by cd.yml (deploy job runs only on push to main).
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: "20"
  POSTGRES_VERSION: "16"

jobs:
  # ── Backend lint ────────────────────────────────────────────────────────────
  lint-backend:
    name: Backend — Lint & Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm audit --audit-level=high
        continue-on-error: true  # report but don't fail CI on advisories

  # ── Backend tests ───────────────────────────────────────────────────────────
  test-backend:
    name: Backend — Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB:       watersim_test
          POSTGRES_USER:     watersim_test
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U watersim_test -d watersim_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV:          test
      DATABASE_URL:      postgres://watersim_test:test_password@localhost:5432/watersim_test
      JWT_SECRET:        ci-test-secret-at-least-32-characters-long
      JWT_ACCESS_EXPIRES_IN:  15m
      JWT_REFRESH_EXPIRES_IN: 7d
      BCRYPT_ROUNDS:     4   # fast in tests
      PORT:              4000
      API_VERSION:       v1
      CORS_ORIGIN:       http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Run migrations (test DB)
        run: node src/db/migrate.js up

      - name: Run tests with coverage
        run: npm run test:ci

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 14

  # ── Frontend lint ────────────────────────────────────────────────────────────
  lint-frontend:
    name: Frontend — Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm audit --audit-level=high
        continue-on-error: true

  # ── Frontend tests ───────────────────────────────────────────────────────────
  test-frontend:
    name: Frontend — Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm test -- --run

  # ── Docker image builds (smoke test only, no push) ───────────────────────────
  build-images:
    name: Docker — Build Images
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: false
          tags: watersim-backend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: false
          tags: watersim-frontend:ci-${{ github.sha }}
          build-args: |
            VITE_API_BASE=/api/v1
            VITE_WS_URL=wss://placeholder.example.com/ws
          cache-from: type=gha
          cache-to:   type=gha,mode=max
