# ─────────────────────────────────────────────────────────────────────────────
# WaterSim Pro — Playwright E2E (scaffold)
#
# ⚠️  NEVER EXECUTED YET. This workflow was scaffolded alongside the Playwright
#     config (playwright.config.js + e2e/smoke.spec.js) but has not been run in
#     this repo — browsers were deliberately not downloaded locally either.
#     Trigger is `workflow_dispatch` ONLY so it is runnable on demand without
#     blocking CI. Expect a shake-down run before trusting it.
#
# What it does: Postgres service → migrate → seed (creates the demo-org admin
# used by e2e/smoke.spec.js) → install Chromium → `npm run e2e` (Playwright's
# webServer entries start backend on 3001 and Vite on 5173 themselves).
# ─────────────────────────────────────────────────────────────────────────────

name: E2E (manual)

on:
  workflow_dispatch:

env:
  NODE_VERSION: "20"

jobs:
  e2e-smoke:
    name: Playwright — Smoke
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB:       watersim_e2e
          POSTGRES_USER:     watersim_e2e
          POSTGRES_PASSWORD: e2e_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U watersim_e2e -d watersim_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV:          development
      DATABASE_URL:      postgres://watersim_e2e:e2e_password@localhost:5432/watersim_e2e
      JWT_SECRET:        e2e-test-secret-at-least-32-characters-long
      JWT_ACCESS_EXPIRES_IN:  15m
      JWT_REFRESH_EXPIRES_IN: 7d
      BCRYPT_ROUNDS:     4
      PORT:              3001
      API_VERSION:       v1
      CORS_ORIGIN:       http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Run migrations
        run: npm run db:migrate

      - name: Seed demo data (demo-org admin used by the smoke spec)
        run: npm run db:seed

      - name: Install Playwright browser (Chromium only)
        run: npx playwright install --with-deps chromium

      - name: Run e2e smoke suite
        run: npm run e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
