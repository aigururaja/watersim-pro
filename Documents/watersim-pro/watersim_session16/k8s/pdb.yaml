# ─────────────────────────────────────────────────────────────────────────────
# PodDisruptionBudgets — keep at least one replica of each tier during
# voluntary disruptions (node drains, cluster upgrades).
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend-pdb
  namespace: watersim
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: backend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend-pdb
  namespace: watersim
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: frontend
