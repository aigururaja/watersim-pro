# ─────────────────────────────────────────────────────────────────────────────
# PostgreSQL — StatefulSet + PersistentVolumeClaim + Service
# For production, consider a managed DB (RDS, Cloud SQL) over this StatefulSet.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: watersim
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser:  999
        runAsGroup: 999
        fsGroup:    999
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: watersim_prod
            - name: POSTGRES_USER
              value: watersim
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: watersim-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command: [pg_isready, -U, watersim, -d, watersim_prod]
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: [pg_isready, -U, watersim, -d, watersim_prod]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu:    250m
              memory: 256Mi
            limits:
              cpu:    1000m
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: watersim
spec:
  selector:
    app: postgres
  clusterIP: None     # headless — StatefulSet DNS
  ports:
    - port: 5432
