# ─────────────────────────────────────────────────────────────────────────────
# WaterSim Pro — Nginx frontend config
# Serves Vite static build and proxies /api/* + /ws/* to the backend service.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen       80;
    server_name  _;

    # ── Security headers (additional to Helmet on backend) ──────────────────
    add_header X-Frame-Options          "SAMEORIGIN"      always;
    add_header X-Content-Type-Options   "nosniff"         always;
    add_header Referrer-Policy          "strict-origin"   always;

    # ── Static assets — React SPA ─────────────────────────────────────────────
    root  /usr/share/nginx/html;
    index index.html;

    # Cache hashed assets (Vite filenames contain content hash)
    location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|webp)$ {
        expires     1y;
        add_header  Cache-Control "public, immutable";
        try_files   $uri =404;
    }

    # React Router — serve index.html for all non-file paths
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API proxy ─────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── WebSocket proxy (collaboration) ──────────────────────────────────────
    location /ws/ {
        proxy_pass         http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;   # keep WS alive for long sessions
    }

    # ── Health check endpoint (for load balancers) ────────────────────────────
    location /health {
        proxy_pass http://backend:4000/health;
    }
}
